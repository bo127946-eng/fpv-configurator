name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Initialize full Flutter project structure
        run: |
          # Создаем временный проект со всеми android/ios папками
          flutter create temp_project --platforms=android --org=com.fpv
          
          # Копируем созданные системные папки (android и т.д.) в корень нашего репозитория
          cp -r temp_project/android ./
          
          # Удаляем временную папку
          rm -rf temp_project

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

