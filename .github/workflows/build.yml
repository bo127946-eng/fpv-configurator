name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.example.xfire --project-name xfire .

      - name: Copy MainActivity.kt if in repo root
        run: |
          if [ -f "MainActivity.kt" ]; then
            mkdir -p android/app/src/main/kotlin/com/example/xfire
            cp MainActivity.kt android/app/src/main/kotlin/com/example/xfire/MainActivity.kt
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
