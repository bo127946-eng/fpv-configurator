name: fpv_configurator
description: A professional cross-platform mobile configurator for FPV drones based on STM32 architecture (YMFC-32) with USB OTG support.
publish_to: 'none'
version: 2.6.2+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/fc401.bin
