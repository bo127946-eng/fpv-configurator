name: fpv_drone_configurator
description: "A professional cross-platform mobile configurator for STM32 FPV flight controllers."
publish_to: 'none'
version: 2.6.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.2
  flutter_blue_plus: 1.31.16
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firmware.hex
    - assets/documentation.xml
