name: fpv_drone_configurator_pro
description: "A professional cross-platform mobile FPV drone configurator for STM32 flight controllers (USB-only version)."
publish_to: 'none'
version: 2.6.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/documentation.xml
    - assets/firmware.hex
