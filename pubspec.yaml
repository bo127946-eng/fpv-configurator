name: fpv_drone_configurator_pro
description: A professional cross-platform mobile configurator for FPV drones based on STM32 architecture (YMFC-32) with USB OTG support.
publish_to: 'none'
version: 2.6.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/doc.txt
    - assets/firmware.hex
