name: fpv_configurator
description: "A new Flutter project for FPV Drone Configurator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.2
  flutter_blue_plus: ^1.35.0

dependency_overrides:
  flutter_blue_plus_android: ^1.34.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/firmware.hex
